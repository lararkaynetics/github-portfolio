<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Larar Kaynetics</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        header {
            position: relative;
            height: 100vh;
            background: url('your-hero-image.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        header h1 {
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        section {
            padding: 60px 20px;
        }
        .projects {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .project {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .project:hover {
            transform: scale(1.05);
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Portfolio</h1>
        <p>Web Developer & Designer</p>
        <a href="#projects">View My Work</a>
    </header>
    <section id="projects">
        <h2>Featured Projects</h2>
        <div class="projects">
            <div class="project"><img src="project1.jpg" alt="Project 1"><p>Project Description</p></div>
            <div class="project"><img src="project2.jpg" alt="Project 2"><p>Project Description</p></div>
            <div class="project"><img src="project3.jpg" alt="Project 3"><p>Project Description</p></div>
        </div>
    </section>
    <section id="skills">
        <h2>My Skills</h2>
        <p>HTML, CSS, JavaScript, React, Node.js</p>
    </section>
    <footer>
        <p>Contact: lararkaynetics@example.com</p>
        <p>&copy; 2026 Larar Kaynetics</p>
    </footer>
</body>
</html>
