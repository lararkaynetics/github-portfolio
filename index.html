<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        header {
            background: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        section {
            padding: 100px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s;
        }
        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .project {
            background: #eee;
            padding: 20px;
            border-radius: 5px;
            transition: transform 0.3s;
        }
        .project:hover {
            transform: scale(1.05);
            background: #fff;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
    </header>
    <section style="background: #f4f4f4;">
        <h2>About Me</h2>
        <p>Welcome to my portfolio! I am a web developer with a passion for modern design and user experience.</p>
    </section>
    <section>
        <h2>Projects</h2>
        <div class="portfolio">
            <div class="project">Project 1</div>
            <div class="project">Project 2</div>
            <div class="project">Project 3</div>
            <div class="project">Project 4</div>
            <div class="project">Project 5</div>
            <div class="project">Project 6</div>
        </div>
    </section>
    <footer>
        <p>© 2026 My Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
